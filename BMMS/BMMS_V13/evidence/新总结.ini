所以 Case3 的这些 0.2–0.3 μs 起伏不可能是我们 AM256/BN128 改坏它造成的。

Case15 稍微有一点不同：它的 dispatch 顺序在 Case12 专用检查之后，所以 host 端会多经过一次 bmms12opt::TryLaunch() 的 false check。但这只是一个很小的 host-side predicate，而且从数据看 Case15 最近均值并没有变差，因此也没有证据说明这是实质性回退。

